<!DOCTYPE html>
<html lang="hr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiO Printer - Garan naljepnice</title>
  <meta name="author" content="Marin Cvetko" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1>AiO Printer - Garan naljepnice</h1>

  <div id="filters">
    <label for="searchInput">Traži po Modelu:</label>
    <input type="text" id="searchInput" placeholder="Upiši model..." />

    <label for="brandFilter">Filter po Marki:</label>
    <select id="brandFilter">
      <option value="all">Sve</option>
    </select>
  </div>

  <table id="imageTable">
    <thead>
      <tr>
        <th>Označi za print</th>
        <th>Model</th>
        <th>Marka</th>
        <th>Slika</th>
        <th>Količina</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <nav id="pagination" aria-label="Navigacija kroz artikle"></nav>

  <br>

  <button id="printBtn" type="button">Isprintaj označeno</button>
  <span id="totalModelCount"></span>

  <br><br>

  <label id="printBtnLabel">
    <span id="printInfo"></span>

    <p>U ispisu isključiti dvostrano printanje i pod margine staviti "bez margina ili nema margina".<br>
      Također, postavku skaliranje staviti na zadano ili prilagodi stranici, da se ne prelijeva na drugu stranicu.
    </p>

    <p>Ukoliko nešto ne radi:<br>
      marin.cvetko123@gmail.com | ludbreg@vacom.hr
    </p>

    <p>
      Ažuriranja / Changelog:<br>
      02/10/2026 - Dodane marke ASUS i TESLA.<br>
      30/09/2026 - Dodan Trust, DELL, HP, Corsair, MSI. Popravljena veličina za OFA marku.
    </p>
  </label>

  <iframe id="printFrame" title="Print frame"></iframe>

  <script src="script.js"></script>
</body>

</html>
